name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build packages
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            build-essential \
            meson \
            ninja-build \
            pkg-config \
            qt6-base-dev \
            qt6-tools-dev \
            qt6-tools-dev-tools \
            qt6-webengine-dev \
            libkf6coreaddons-dev \
            libkf6i18n-dev \
            libkf6xmlgui-dev \
            dpkg-dev \
            fakeroot \
            rpm

      - name: Get version
        id: version
        run: |
          VERSION=$(sed -n "s/.*version: '\\([^']*\\)'.*/\1/p" meson.build)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION"

      - name: Configure
        run: |
          meson setup build \
            --buildtype=release \
            --prefix=/usr

      - name: Build
        run: |
          meson compile -C build

      - name: Install to staging directory
        run: |
          DESTDIR="$PWD/stage" meson install -C build

      - name: Create TAR.GZ
        run: |
          tar \
            -C stage \
            -czf "Perch-${{ steps.version.outputs.version }}-linux-x86_64.tar.gz" \
            .

      - name: Create DEB
        run: |
          mkdir -p deb/DEBIAN

          cp -a stage/. deb/

          cat > deb/DEBIAN/control <<EOF
          Package: perch
          Version: ${{ steps.version.outputs.version }}
          Section: utils
          Priority: optional
          Architecture: amd64
          Maintainer: FlaipyTheHost
          Description: Lightweight popup launcher for web services
           A lightweight popup launcher for your favorite web services,
           built with Qt 6 and KDE Frameworks 6.
          EOF

          dpkg-deb \
            --build \
            deb \
            "Perch-${{ steps.version.outputs.version }}-amd64.deb"

      - name: Create RPM
        run: |
          mkdir -p \
            rpm/{BUILD,BUILDROOT,RPMS,SOURCES,SRPMS,SPECS}

          cat > rpm/SPECS/perch.spec <<EOF
          Name:           perch
          Version:        ${{ steps.version.outputs.version }}
          Release:        1%{?dist}
          Summary:        Lightweight popup launcher for web services
          License:        GPL-3.0-or-later
          URL:            https://github.com/${{ github.repository }}

          %description
          A lightweight popup launcher for your favorite web services,
          built with Qt 6 and KDE Frameworks 6.

          %install
          rm -rf %{buildroot}
          mkdir -p %{buildroot}
          cp -a "$PWD/stage/." %{buildroot}/

          %files
          /usr/bin/perch
          /usr/share/applications/io.FlaipyTheHost.Perch.desktop
          /usr/share/icons/hicolor/scalable/apps/io.FlaipyTheHost.Perch.svg
          EOF

          rpmbuild \
            --define "_topdir $PWD/rpm" \
            --define "_rpmdir $PWD/rpm/RPMS" \
            --target x86_64 \
            -bb rpm/SPECS/perch.spec

          cp rpm/RPMS/x86_64/*.rpm \
            "Perch-${{ steps.version.outputs.version }}-x86_64.rpm"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            Perch-${{ steps.version.outputs.version }}-linux-x86_64.tar.gz
            Perch-${{ steps.version.outputs.version }}-amd64.deb
            Perch-${{ steps.version.outputs.version }}-x86_64.rpm
